name: Project validation
on:
  pull_request:
  push:
    branches: [main, refactor/vite-react-migration, refactor/native-compose, 'audit/**', 'improve/**', 'fix/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  SOURCE_REVISION: ${{ github.sha }}
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate release notes with Node built-ins
        run: node scripts/check-release-notes.mjs
      - name: Native unit tests and application/instrumentation compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-report
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
  native-api28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native UI integration tests on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon -PflowTestBuildType=nativeDebug :app:connectedNativeDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-api28-instrumentation-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
