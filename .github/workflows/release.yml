# A tag builds a draft release only after validating that same commit.
name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check tag and package complete source from the validated commit
        run: |
          VERSION=$(node -p "require('./package.json').version.replace('-r', '.r')")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag does not match package version: $GITHUB_REF_NAME vs v$VERSION"
            exit 1
          fi
          node scripts/package-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > android/flow-release.jks
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/flow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version.replace('-r', '.r')")
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Potik-v${VERSION}.apk"
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Potik-*.apk
            dist/Potik-*-source.zip
          generate_release_notes: true
          draft: true
      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Potik-release-candidate
          path: |
            dist/Potik-*.apk
            dist/Potik-*-source.zip
      - name: Remove temporary signing key
        if: always()
        run: rm -f android/flow-release.jks
