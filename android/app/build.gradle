apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// package.json is the only version source: 1.7.6-r10 -> 1.7.6.r10 / 1070610.
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version.toString()
def versionMatch = packageVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-r(\d+))?$/
if (!versionMatch.matches()) throw new GradleException("Unsupported package version: ${packageVersion}")
def versionMajor = versionMatch[0][1].toInteger()
def versionMinor = versionMatch[0][2].toInteger()
def versionPatch = versionMatch[0][3].toInteger()
def versionRevision = versionMatch[0][4] ? versionMatch[0][4].toInteger() : 0
if (versionMinor > 99 || versionPatch > 99 || versionRevision > 99) {
    throw new GradleException('Minor, patch and revision must be 0..99 for the Android versionCode formula')
}
def packageVersionCode = versionMajor * 1000000L + versionMinor * 10000L + versionPatch * 100L + versionRevision
if (packageVersionCode < 1 || packageVersionCode > 2100000000L) throw new GradleException('Android versionCode is out of range')

android {
    namespace = "com.flow.adhd"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.flow.adhd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode packageVersionCode.toInteger()
        versionName packageVersion.replace('-r', '.r')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ─── ПІДПИС РЕЛІЗІВ ───────────────────────────────────────────────
    // Ключ читається з env-змінних (CI / GitHub Actions) або з android/keystore.properties
    // (локально; файл у .gitignore — НЕ комітити). Без ключа release лишиться непідписаним.
    signingConfigs {
        release {
            def ksProps = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) { propsFile.withInputStream { ksProps.load(it) } }
            def ksPath = System.getenv('KEYSTORE_FILE') ?: ksProps.getProperty('storeFile')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: ksProps.getProperty('storePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: ksProps.getProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: ksProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        // Capacitor's generated build script also targets 21 during transition.
        jvmTarget = '21'
    }
    buildFeatures {
        // потрібно, щоб FlowBridge.appVersion() бачив BuildConfig.VERSION_NAME
        compose true
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ── Room Database ──────────────────────────────────────
    // Kotlin 2.2 metadata requires the current Room processor; database schema stays v1.
    implementation "androidx.room:room-runtime:2.8.5"
    annotationProcessor "androidx.room:room-compiler:2.8.5"
}

// ─── АВТОКОПІЯ APK ────────────────────────────────────────────────────
// Копіювання лише за явним -PflowApkOutput=<directory>.
// Звичайна збірка залишає APK у теці build/outputs.
// УВАГА: файл має лишатися в UTF-8 (без BOM), інакше ім'я і коментарі поб'ються.
tasks.register('copyApkToFlow') {
    doLast {
        def src = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        def destination = project.findProperty('flowApkOutput')
        if (!destination) throw new GradleException('Use -PflowApkOutput=<directory> to copy an APK explicitly')
        def dir = new File(destination.toString())
        dir.mkdirs()
        def dst = new File(dir, 'Потік.apk')
        java.nio.file.Files.copy(src.toPath(), dst.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        // і одразу архів поруч (перезапис) — для пересилання
        def zip = new File(dir, 'Потік.zip')
        new java.util.zip.ZipOutputStream(new FileOutputStream(zip)).withCloseable { zos ->
            zos.putNextEntry(new java.util.zip.ZipEntry('Потік.apk'))
            dst.withInputStream { zos << it }
            zos.closeEntry()
        }
        println "APK скопійовано: ${dst}"
        println "Архів оновлено: ${zip}"
    }
}
afterEvaluate {
    if (project.hasProperty('flowApkOutput')) tasks.named('assembleDebug').configure { finalizedBy 'copyApkToFlow' }
}

apply from: 'capacitor.build.gradle'
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
